<meta name="theme-color" content="#1A56DB">
<title>考公晨读·每日精粹</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#1A56DB;--primary-light:#E8EFFD;--primary-dark:#0F3A8C;--accent:#E67E22;--bg:#F0F2F5;--card:#FFF;--text:#1E293B;--text2:#64748B;--green:#10B981;--red:#EF4444;--radius:12px;--shadow:0 1px 6px rgba(0,0,0,.05)}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;padding:0 0 76px;max-width:480px;margin:0 auto}
@media(orientation:landscape){body{max-width:100%;padding:0 24px 80px}}
@media(min-width:900px){body{max-width:960px}}
.header{background:linear-gradient(135deg,var(--primary),#2563EB);padding:14px 18px 16px;color:#fff;position:sticky;top:0;z-index:10}
.h-top{display:flex;justify-content:space-between;align-items:center}
.h-title{font-size:1.05rem;font-weight:700;letter-spacing:.5px}
.h-sub{font-size:.6rem;opacity:.8}
.h-badge{background:rgba(255,255,255,.18);padding:2px 10px;border-radius:14px;font-size:.6rem}
.h-row2{display:flex;justify-content:space-between;margin-top:6px;font-size:.7rem;opacity:.85}
.container{padding:0 12px}.page{display:none}.page.active{display:block}
.t-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;display:flex;align-items:center;gap:10px;margin-top:-10px;position:relative;z-index:2}
.t-icon{width:36px;height:36px;background:var(--primary-light);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.t-label{font-size:.6rem;color:var(--text2);letter-spacing:1px}
.t-name{font-size:.95rem;font-weight:700;color:var(--primary-dark)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:10px}
.c-hd{display:flex;align-items:center;gap:8px;padding:12px 16px 0}
.c-hd .ico{width:24px;height:24px;background:var(--primary-light);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.c-hd h2{font-size:.85rem;font-weight:700}
.c-bd{padding:10px 16px 14px}
.q-src{display:inline-block;background:#EEF2FF;color:var(--primary);font-size:.6rem;font-weight:600;padding:2px 8px;border-radius:4px;margin-bottom:8px}
.q-txt{font-size:.88rem;line-height:1.7;padding-left:12px;border-left:3px solid var(--primary);font-weight:500}
.q-scene{display:flex;gap:6px;background:#FFF8F0;padding:8px 12px;border-radius:8px;font-size:.75rem;color:#8B5E2A;margin-top:8px;align-items:flex-start}
.q-scene .tag{background:var(--accent);color:#fff;font-size:.55rem;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.c-ev{font-size:.85rem;line-height:1.65;padding:10px 12px;background:#F8FAFC;border-radius:8px;border-left:3px solid #3B82F6}
.c-bdg{display:inline-block;background:#DC2626;color:#fff;font-size:.5rem;font-weight:600;padding:1px 5px;border-radius:3px;margin-right:5px;vertical-align:middle}
.c-ap{display:flex;gap:6px;background:#F0F9FF;padding:8px 12px;border-radius:8px;font-size:.75rem;color:#0369A1;margin-top:8px;align-items:flex-start}
.c-ap .tag{background:#0EA5E9;color:#fff;font-size:.55rem;padding:1px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.cv-n{font-size:.85rem;font-weight:700;color:var(--primary-dark);padding:6px 12px;background:var(--primary-light);border-radius:6px;display:inline-block;margin-bottom:8px}
.cv-d{font-size:.82rem;line-height:1.7}
.cv-q{margin-top:8px;background:linear-gradient(135deg,#FEF3C7,#FDE68A);padding:10px 14px;border-radius:8px;font-size:.8rem;font-weight:600;color:#92400E}
.tip-c{background:linear-gradient(135deg,#ECFDF5,#D1FAE5);border-radius:var(--radius);padding:12px 16px;display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.tip-c .ico{font-size:1rem;flex-shrink:0}
.tip-c .txt{font-size:.78rem;color:#065F46;line-height:1.5}
.ex-header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.ex-progress{font-size:.75rem;color:var(--text2)}
.ex-progress span{color:var(--primary);font-weight:700;font-size:.85rem}
.ex-timer{font-size:.75rem;color:var(--text2)}
.ex-timer span{font-weight:600;color:var(--accent)}
.q-type{display:inline-block;background:var(--primary-light);color:var(--primary-dark);font-size:.6rem;font-weight:600;padding:2px 8px;border-radius:4px;margin-bottom:8px}
.q-text{font-size:.92rem;line-height:1.75;font-weight:500;margin-bottom:14px;white-space:pre-wrap}
.q-options{display:flex;flex-direction:column;gap:8px}
.q-opt{padding:12px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:.88rem;line-height:1.5;cursor:pointer;background:var(--card);-webkit-tap-highlight-color:transparent}
.q-opt.sel{border-color:var(--primary);background:var(--primary-light)}
.q-opt.cor{border-color:var(--green);background:#ECFDF5;color:#065F46}
.q-opt.wro{border-color:var(--red);background:#FEF2F2;color:#991B1B}
.q-opt.dis{pointer-events:none;opacity:.95}
.q-opt .mk{float:right;font-size:.75rem;font-weight:600}
.q-nav{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;text-align:center}
.btn-pri{background:var(--primary);color:#fff}
.btn-pri:disabled{background:#94A3B8}
.btn-out{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn-out:disabled{opacity:.4}
.btn-green{background:var(--green);color:#fff}
.ax-box{background:#F8FAFC;border-radius:10px;padding:14px;margin-top:14px}
.ax-box .ah{font-size:.78rem;font-weight:700;color:var(--primary);margin-bottom:6px}
.ax-box .at{font-size:.8rem;line-height:1.7;color:var(--text)}
.ax-box .at .an{display:inline-block;background:var(--green);color:#fff;font-size:.65rem;font-weight:600;padding:1px 8px;border-radius:4px;margin-right:4px}
.pwa-tip{position:fixed;bottom:58px;left:0;right:0;z-index:99;text-align:center;font-size:.6rem;color:var(--text2);padding:4px;background:linear-gradient(90deg,transparent,rgba(26,86,219,.06),transparent);animation:pwaPulse 3s ease-in-out infinite;max-width:480px;margin:0 auto;pointer-events:none}
@keyframes pwaPulse{0%,100%{opacity:.5}50%{opacity:1}}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid #E2E8F0;display:flex;justify-content:space-around;align-items:center;padding:5px 0 9px;max-width:480px;margin:0 auto;z-index:100}
@media(orientation:landscape){.nav{max-width:100%}}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.55rem;color:var(--text2);background:none;border:none;padding:3px 16px;cursor:pointer}
.nav-item .ni{font-size:1.1rem}
.nav-item.act{color:var(--primary);font-weight:600}
.sp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.sb{text-align:center;background:#F8FAFC;border-radius:10px;padding:14px 6px}
.sb .n{font-size:1.2rem;font-weight:700;color:var(--primary)}
.sb .l{font-size:.6rem;color:var(--text2);margin-top:4px}
.hi{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #E2E8F0}
.hi:last-child{border-bottom:none}
.hi .d{font-size:.8rem;font-weight:600}
.hi .s{font-size:.75rem;color:var(--text2)}
.ei{padding:12px;background:#FEF2F2;border-radius:8px;margin-bottom:8px}
.ei .eq{font-size:.82rem;margin-bottom:4px}
.ei .qq{color:var(--text)}
.ei .aa{color:var(--green);font-weight:600;font-size:.72rem}
.ei .yy{color:var(--red);font-size:.72rem}
.ei .pp{color:var(--text2);font-size:.72rem;margin-top:4px}
.ft{text-align:center;font-size:.6rem;color:var(--text2);padding:14px 0 4px}

<script>
// ===== 数据 =====
var DATA = JSON.parse('{\n  "date": "2026年8月7日 星期五",\n  "issue": 11,\n  "topic": "聚焦新质生产力与绿色转型：政策组合拳下的高质量发展新动能",\n  "quoteSource": "《人民日报》2026年8月7日头版评论",\n  "quoteText": "绿色不是发展的代价，而是高质量发展的底色；创新不是孤立的突破，而是系统能力的跃升。",\n  "quoteScene": "在国务院新闻办8月6日举行的“推动高质量发展”系列主题新闻发布会上，国家发展改革委副主任强调，要统筹能源安全与低碳转型，加快形成新质生产力。",\n  "caseEvent": "2026年8月6日，国家能源局发布《2026年上半年能源形势报告》显示，全国可再生能源发电装机占比首次超过60%，其中光伏发电新增装机同比增长45%。同时，国务院常务会议审议通过《关于加快制造业绿色化发展的指导意见》，提出到2030年规模以上工业单位增加值能耗较2025年下降18%。",\n  "caseApply": "在申论写作或面试中，可引用此案例论证“绿色发展是高质量发展的底色”这一观点。具体可结合企业转型实例，如某钢铁企业通过氢冶金技术实现碳排放下降30%，说明传统产业通过技术创新可以实现绿色升级，同时提升竞争力。",\n  "conceptName": "新质生产力",\n  "conceptDesc": "新质生产力是由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生的先进生产力质态，以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵，以全要素生产率大幅提升为核心标志。",\n  "conceptQuick": "新质生产力 = 高科技 + 高效能 + 高质量，核心在创新，落点在产业。",\n  "tipText": "晨读时注意积累“新质生产力”“绿色转型”“能源安全”等热词，并关联“双碳”目标、数字经济、传统产业升级等政策。今日12题中，常识题侧重时政记忆，言语题注意关键词对应，判断题考察逻辑关系，数量题需快速计算增长率。",\n  "questions": [\n    {\n      "id": 1,\n      "type": "常识判断",\n      "question": "根据2026年8月6日国家能源局发布的数据，全国可再生能源发电装机占比首次超过多少？",\n      "options": [\n        "50%",\n        "55%",\n        "60%",\n        "65%"\n      ],\n      "answer": 2,\n      "analysis": "报告显示，可再生能源发电装机占比首次超过60%，故选C。"\n    },\n    {\n      "id": 2,\n      "type": "常识判断",\n      "question": "国务院常务会议审议通过的《关于加快制造业绿色化发展的指导意见》提出，到2030年规模以上工业单位增加值能耗较2025年下降多少？",\n      "options": [\n        "15%",\n        "18%",\n        "20%",\n        "25%"\n      ],\n      "answer": 1,\n      "analysis": "意见明确下降18%，故选B。"\n    },\n    {\n      "id": 3,\n      "type": "常识判断",\n      "question": "下列哪项属于“新质生产力”的核心标志？",\n      "options": [\n        "全要素生产率大幅提升",\n        "固定资产投资规模扩大",\n        "出口总额持续增长",\n        "人口红利充分释放"\n      ],\n      "answer": 0,\n      "analysis": "新质生产力以全要素生产率大幅提升为核心标志，故选A。"\n    },\n    {\n      "id": 4,\n      "type": "言语理解",\n      "question": "文中画线句子“绿色不是发展的代价，而是高质量发展的底色”意在强调：",\n      "options": [\n        "绿色转型会增加发展成本",\n        "绿色发展是高质量发展的内在要求",\n        "高质量发展必须牺牲环境",\n        "绿色发展仅适用于工业领域"\n      ],\n      "answer": 1,\n      "analysis": "句子用“不是……而是……”强调绿色是高质量发展的底色，即内在要求，故选B。"\n    },\n    {\n      "id": 5,\n      "type": "言语理解",\n      "question": "填入下列横线处的词语，最恰当的一组是：\\n实现绿色转型，需要____传统产业的改造升级，____新兴产业的培育壮大，____制度体系的完善。",\n      "options": [\n        "加快 促进 推动",\n        "推进 加快 加强",\n        "强化 推动 完善",\n        "统筹 兼顾 健全"\n      ],\n      "answer": 3,\n      "analysis": "“统筹”搭配“改造升级”和“培育壮大”体现全局观，“健全”搭配“制度体系”更规范，故选D。"\n    },\n    {\n      "id": 6,\n      "type": "言语理解",\n      "question": "下列语句中，没有语病的一项是：",\n      "options": [\n        "通过技术创新，使该企业碳排放下降了30%。",\n        "该报告显示，可再生能源装机占比首次超过六成，这标志着能源结构转型取得重大进展。",\n        "关于制造业绿色化发展的指导意见，国务院已审议通过并发布实施。",\n        "由于政策支持，使得新能源产业快速发展。"\n      ],\n      "answer": 1,\n      "analysis": "A项缺少主语，C项语序不当，D项“由于……使得”滥用介词导致主语缺失，B项表述正确。"\n    },\n    {\n      "id": 7,\n      "type": "判断推理",\n      "question": "所有新能源企业都重视技术创新。某钢铁企业不是新能源企业，所以该钢铁企业不重视技术创新。以下哪项与上述推理结构最为相似？",\n      "options": [\n        "所有公务员都要通过考试。小李是公务员，所以小李通过了考试。",\n        "所有水果都含有维生素。苹果是水果，所以苹果含有维生素。",\n        "所有优秀员工都勤奋工作。小王不勤奋工作，所以小王不是优秀员工。",\n        "所有金属都能导电。塑料不是金属，所以塑料不能导电。"\n      ],\n      "answer": 3,\n      "analysis": "题干结构为“所有A是B，C不是A，所以C不是B”，D项“金属→导电，塑料不是金属→不导电”完全一致，故选D。"\n    },\n    {\n      "id": 8,\n      "type": "判断推理",\n      "question": "根据材料，可以推出：\\n①可再生能源装机占比超过60%\\n②光伏发电新增装机同比增长45%\\n③规模以上工业单位增加值能耗下降18%",\n      "options": [\n        "只有①",\n        "只有①②",\n        "只有①③",\n        "①②③"\n      ],\n      "answer": 1,\n      "analysis": "材料中明确提到①②，③是2030年目标，尚未实现，故只有①②，选B。"\n    },\n    {\n      "id": 9,\n      "type": "判断推理",\n      "question": "某专家认为：发展新质生产力必须依赖大规模投资。以下哪项如果为真，最能削弱该观点？",\n      "options": [\n        "某地依靠制度创新和人才引进，未增加投资却实现了产业升级。",\n        "新质生产力需要大量研发投入。",\n        "投资是经济增长的重要引擎。",\n        "部分地区投资效率低下。"\n      ],\n      "answer": 0,\n      "analysis": "A项通过反例说明不依赖大规模投资也能发展新质生产力，直接削弱，故选A。"\n    },\n    {\n      "id": 10,\n      "type": "数量关系",\n      "question": "2025年上半年光伏新增装机量为80吉瓦，2026年上半年同比增长45%，则2026年上半年光伏新增装机量为多少吉瓦？",\n      "options": [\n        "100",\n        "116",\n        "120",\n        "124"\n      ],\n      "answer": 1,\n      "analysis": "80×(1+45%)=80×1.45=116，故选B。"\n    },\n    {\n      "id": 11,\n      "type": "数量关系",\n      "question": "某制造业企业2025年单位增加值能耗为1.2吨标准煤/万元，若到2030年下降18%，则2030年单位增加值能耗为多少吨标准煤/万元？",\n      "options": [\n        "0.984",\n        "1.016",\n        "1.104",\n        "1.152"\n      ],\n      "answer": 0,\n      "analysis": "1.2×(1-18%)=1.2×0.82=0.984，故选A。"\n    },\n    {\n      "id": 12,\n      "type": "数量关系",\n      "question": "某地区可再生能源装机容量从2020年的200吉瓦增长到2026年的320吉瓦，则年均增长率约为多少？（假设年均增长率相同）",\n      "options": [\n        "8%",\n        "10%",\n        "12%",\n        "15%"\n      ],\n      "answer": 1,\n      "analysis": "设年均增长率为r，则200×(1+r)^6=320，(1+r)^6=1.6，估算r≈10%（1.1^6≈1.77，1.08^6≈1.59），更接近10%，故选B。"\n    }\n  ]\n}');

// ===== 加载首页 =====
function loadHome(){
  document.getElementById('hdDate').textContent = DATA.date;
  document.getElementById('hdIssue').textContent = '第'+DATA.issue+'期';
  document.getElementById('elTopic').textContent = DATA.topic;
  document.getElementById('elQSrc').textContent = DATA.quoteSource;
  document.getElementById('elQTxt').textContent = DATA.quoteText;
  document.getElementById('elQScene').textContent = DATA.quoteScene;
  document.getElementById('elCaseEv').innerHTML = '<span class="c-bdg">事件</span>'+DATA.caseEvent;
  document.getElementById('elCaseAp').textContent = DATA.caseApply;
  document.getElementById('elCvN').textContent = DATA.conceptName;
  document.getElementById('elCvD').textContent = DATA.conceptDesc;
  document.getElementById('elCvQ').textContent = DATA.conceptQuick;
  document.getElementById('elTip').innerHTML = '<strong>今日背诵提示：</strong>'+DATA.tipText;
}

// ===== 页面切换 =====
function goPage(idx){
  var navs = document.querySelectorAll('.nav-item');
  for(var i=0;i<navs.length;i++) navs[i].classList.remove('act');
  navs[idx].classList.add('act');
  var pages = document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++) pages[i].classList.remove('active');
  pages[idx].classList.add('active');
  if(idx===1) renderExam();
  if(idx===2) renderScore();
}

// ===== 答题状态 =====
var QS = {idx:0,ans:{},done:false,start:0};

// ===== 渲染练习 =====
function renderExam(){
  var qs = DATA.questions;
  if(!qs || qs.length===0){
    document.getElementById('examBody').innerHTML = '<div class="emp"><span class="bg">&#x1F4DD;</span>今日暂无题目</div>';
    return;
  }
  if(QS.done){
    showResult(); return;
  }
  if(QS.start===0) QS.start = Date.now();

  var total = qs.length;
  var ci = QS.idx;
  var q = qs[ci];
  var sel = QS.ans[ci];

  var h = '';
  h += '<div class="ex-header"><div class="ex-progress">&#x1F4DD; 第 <span>'+(ci+1)+'</span> / '+total+' 题</div><div class="ex-timer">&#x23F1; <span id="tm">0:00</span></div></div>';
  h += '<div class="q-type">'+q.type+'</div>';
  h += '<div class="q-text">'+q.question+'</div>';
  h += '<div class="q-options">';

  for(var i=0;i<q.options.length;i++){
    var cls = 'q-opt';
    if(sel !== undefined){
      cls += ' dis';
      if(i===q.answer) cls += ' cor';
      else if(i===sel) cls += ' wro';
    }
    var mk = '';
    if(sel !== undefined){
      if(i===q.answer) mk = '<span class="mk">&#x2705;</span>';
      else if(i===sel) mk = '<span class="mk">&#x274C;</span>';
    }
    h += '<div class="'+cls+'" onclick="pickAns('+ci+','+i+')">'+q.options[i]+mk+'</div>';
  }
  h += '</div>';

  if(sel !== undefined){
    h += '<div class="ax-box"><div class="ah">&#x1F4D6; 解析</div><div class="at"><span class="an">答案：'+String.fromCharCode(65+q.answer)+'</span> '+q.analysis+'</div></div>';
  }

  h += '<div class="q-nav">';
  if(ci>0) h += '<button class="btn btn-out" onclick="goQ('+(ci-1)+')">&#x25C0; 上一题</button>';
  else h += '<button class="btn btn-out" disabled>&#x25C0; 上一题</button>';

  if(sel!==undefined && ci===total-1) h += '<button class="btn btn-green" onclick="finishExam()">&#x1F4CA; 交卷看成绩</button>';
  else if(sel!==undefined) h += '<button class="btn btn-pri" onclick="goQ('+(ci+1)+')">下一题 &#x25B6;</button>';
  else h += '<button class="btn btn-pri" disabled>请先选择答案 &#x25B6;</button>';
  h += '</div>';

  document.getElementById('examBody').innerHTML = h;
  tickTimer();
}

function pickAns(qi, oi){
  if(QS.ans[qi] !== undefined) return;
  QS.ans[qi] = oi;
  renderExam();
}

function goQ(i){
  QS.idx = i;
  renderExam();
}

function tickTimer(){
  if(QS.start===0 || QS.done) return;
  var el = Math.floor((Date.now()-QS.start)/1000);
  var t = document.getElementById('tm');
  if(t) t.textContent = Math.floor(el/60)+':'+(el%60<10?'0':'')+el%60;
  setTimeout(tickTimer, 1000);
}

function finishExam(){
  QS.done = true;
  var qs = DATA.questions;
  var c = 0;
  for(var i=0;i<qs.length;i++){
    if(QS.ans[i]===qs[i].answer) c++;
  }
  var score = Math.round(c/qs.length*100);

  // 存错题
  var errs = JSON.parse(localStorage.getItem('kg_err')||'[]');
  var errIds = {};
  for(var i=0;i<errs.length;i++) errIds[errs[i].id+'_'+errs[i].date]=1;

  for(var i=0;i<qs.length;i++){
    if(QS.ans[i]!==qs[i].answer){
      var key = qs[i].id+'_'+DATA.date;
      if(!errIds[key]){
        errs.push({id:qs[i].id,date:DATA.date,topic:DATA.topic,type:qs[i].type,question:qs[i].question,options:qs[i].options,answer:qs[i].answer,your:QS.ans[i],analysis:qs[i].analysis});
        errIds[key]=1;
      }
    }
  }
  localStorage.setItem('kg_err', JSON.stringify(errs));

  // 存历史
  var hist = JSON.parse(localStorage.getItem('kg_hist')||'[]');
  hist.unshift({date:DATA.date,issue:DATA.issue,topic:DATA.topic,total:qs.length,correct:c,score:score,elapsed:Math.floor((Date.now()-QS.start)/1000)});
  if(hist.length>50) hist.length=50;
  localStorage.setItem('kg_hist', JSON.stringify(hist));

  renderExam();
}

function showResult(){
  var qs = DATA.questions;
  var c = 0;
  for(var i=0;i<qs.length;i++){if(QS.ans[i]===qs[i].answer) c++;}
  var score = Math.round(c/qs.length*100);
  var el = Math.floor((Date.now()-QS.start)/1000);
  var m = Math.floor(el/60);
  var s = el%60;

  var h = '<div class="rs"><div class="rsc">'+score+'<span class="tl">/'+qs.length+'题</span></div>';
  h += '<div class="rst"><div class="rsi"><div class="n gn">'+c+'</div><div class="l">正确</div></div><div class="rsi"><div class="n rd">'+(qs.length-c)+'</div><div class="l">错误</div></div><div class="rsi"><div class="n">'+m+':'+(s<10?'0':'')+s+'</div><div class="l">用时</div></div></div>';
  h += '<div class="rsb"><div class="rsbi" style="width:'+score+'%"></div></div></div>';

  h += '<div style="margin-top:8px"><div style="font-size:.8rem;font-weight:600;margin-bottom:8px">&#x1F4D6; 逐题解析</div>';
  for(var i=0;i<qs.length;i++){
    var ok = QS.ans[i]===qs[i].answer;
    var bd = ok?'var(--green)':'var(--red)';
    h += '<div style="background:#F8FAFC;border-radius:8px;padding:12px;margin-bottom:8px;border-left:3px solid '+bd+'">';
    h += '<div style="font-size:.72rem;color:var(--text2);margin-bottom:4px">第'+(i+1)+'题 '+(ok?'&#x2705;':'&#x274C;')+'</div>';
    h += '<div style="font-size:.82rem;margin-bottom:6px">'+qs[i].question+'</div>';
    h += '<div style="font-size:.72rem;color:var(--text2)">你选：'+String.fromCharCode(65+QS.ans[i])+' | 正确：<span style="color:var(--green);font-weight:600">'+String.fromCharCode(65+qs[i].answer)+'</span></div>';
    h += '<div style="font-size:.75rem;margin-top:6px;color:var(--text);line-height:1.5">&#x1F4D6; '+qs[i].analysis+'</div></div>';
  }
  h += '</div>';
  h += '<div class="q-nav" style="margin-top:14px"><button class="btn btn-out" onclick="resetExam()">&#x1F504; 重新答题</button><button class="btn btn-pri" onclick="goPage(2)">&#x1F4CA; 查看成绩</button></div>';

  document.getElementById('examBody').innerHTML = h;
}

function resetExam(){
  QS = {idx:0,ans:{},done:false,start:0};
  renderExam();
}

// ===== 成绩页 =====
function renderScore(){
  var hist = JSON.parse(localStorage.getItem('kg_hist')||'[]');
  var errs = JSON.parse(localStorage.getItem('kg_err')||'[]');

  var tE = hist.length;
  var tQ = 0, tC = 0;
  for(var i=0;i<hist.length;i++){tQ+=hist[i].total; tC+=hist[i].correct;}
  var avg = tQ>0 ? Math.round(tC/tQ*100) : 0;

  var h = '<div class="card" style="margin-top:10px"><div class="c-bd">';
  h += '<div class="sp"><div class="sb"><div class="n">'+tE+'</div><div class="l">练习次数</div></div><div class="sb"><div class="n">'+avg+'%</div><div class="l">平均得分率</div></div><div class="sb"><div class="n">'+errs.length+'</div><div class="l">错题总数</div></div></div>';
  h += '<div style="font-size:.8rem;font-weight:600;margin-bottom:8px">&#x1F4CB; 练习记录</div>';

  if(hist.length>0){
    for(var i=0;i<hist.length;i++){
      var hh = hist[i];
      var cl = hh.score>=70 ? 'var(--green)' : 'var(--red)';
      h += '<div class="hi"><div><div class="d">'+hh.date+'</div><div style="font-size:.68rem;color:var(--text2)">'+hh.topic+'</div></div><div class="s">'+hh.correct+'/'+hh.total+' <span style="color:'+cl+';font-weight:600">'+hh.score+'分</span></div></div>';
    }
  } else {
    h += '<div class="emp"><span class="bg">&#x1F4DD;</span>还没有练习记录</div>';
  }
  h += '</div></div>';

  h += '<div class="card"><div class="c-hd"><div class="ico">&#x1F4D5;</div><h2>错题本 <span style="font-size:.65rem;color:var(--text2);font-weight:400">('+errs.length+'题)</span></h2></div><div class="c-bd">';

  if(errs.length>0){
    var show = errs.length>5 ? errs.slice(0,5) : errs;
    for(var i=0;i<show.length;i++){
      var e = show[i];
      h += '<div class="ei">';
      h += '<div style="font-size:.68rem;color:var(--text2);margin-bottom:4px">'+e.date+' | '+e.type+'</div>';
      h += '<div class="eq"><span class="qq">'+e.question+'</span></div>';
      h += '<div>你选：<span class="yy">'+String.fromCharCode(65+e.your)+'</span> | 答案：<span class="aa">'+String.fromCharCode(65+e.answer)+'</span></div>';
      h += '<div class="pp">&#x1F4D6; '+e.analysis+'</div></div>';
    }
    if(errs.length>5){
      h += '<button class="btn btn-out" onclick="showAllErrors()" style="margin-top:8px">查看全部'+errs.length+'道错题 &#x25B6;</button>';
    }
    h += '<button class="btn btn-out" onclick="if(confirm(\'确定清空所有错题？\')){localStorage.setItem(\'kg_err\',\'[]\');renderScore()}" style="margin-top:8px">&#x1F5D1;&#xFE0F; 清空错题本</button>';
  } else {
    h += '<div class="emp"><span class="bg">&#x1F389;</span>暂无错题，继续保持！</div>';
  }
  h += '</div></div>';

  document.getElementById('scoreBody').innerHTML = h;
}

function showAllErrors(){
  var errs = JSON.parse(localStorage.getItem('kg_err')||'[]');
  var h = '<div class="card" style="margin-top:10px"><div class="c-hd"><div class="ico">&#x1F4D5;</div><h2>全部错题('+errs.length+'题)</h2></div><div class="c-bd">';
  for(var i=0;i<errs.length;i++){
    var e = errs[i];
    h += '<div class="ei">';
    h += '<div style="font-size:.68rem;color:var(--text2);margin-bottom:4px">'+e.date+' | '+e.type+'</div>';
    h += '<div class="eq"><span class="qq">'+e.question+'</span></div>';
    h += '<div>你选：<span class="yy">'+String.fromCharCode(65+e.your)+'</span> | 答案：<span class="aa">'+String.fromCharCode(65+e.answer)+'</span></div>';
    h += '<div class="pp">&#x1F4D6; '+e.analysis+'</div></div>';
  }
  h += '<button class="btn btn-out" onclick="renderScore()" style="margin-top:8px">&#x25C0; 返回</button></div></div>';
  document.getElementById('scoreBody').innerHTML = h;
}

// ===== 启动 =====
loadHome();
</script>
