name: 每日晨读自动更新

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成晨读内容
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 auto_update.py

      - name: 推送到仓库
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "晨读机器人"
          git config user.email "bot@kaogong-daily"
          git add data.js index.v2.html index.html build.py
          git commit -m "auto: 晨读更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d')" || echo "无变更"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}
          git push
