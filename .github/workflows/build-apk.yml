name: Build APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'  # 每天6:30北京时间更新后自动打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
      
      - name: Build APK
        run: |
          npx cap init "考公晨读" com.kaogong.daily --webDir=.
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaogong-daily-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
