name: Build APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Create Capacitor config (远程加载模式)
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          # 创建capacitor配置，让APP启动时加载远程URL
          cat > capacitor.config.json << 'EOF'
{
  "appId": "com.kaogong.daily",
  "appName": "考公晨读",
  "webDir": ".",
  "server": {
    "url": "https://yy27578.github.io/kaogong-daily/",
    "allowNavigation": ["yy27578.github.io"]
  }
}
EOF
      
      - name: Build APK
        run: |
          npx cap init --web-dir . 2>/dev/null || true
          npx cap add android
          npx cap sync android
          cd android
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "y" | $ANDROID_HOME/tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaogong-daily-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
