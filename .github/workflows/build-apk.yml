name: Build APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5
      
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
{
  "appId": "com.kaogong.daily",
  "appName": "考公晨读",
  "webDir": ".",
  "server": {
    "url": "https://yy27578.github.io/kaogong-daily/",
    "allowNavigation": ["yy27578.github.io"]
  },
  "plugins": {
    "SplashScreen": {
      "launchShowDuration": 1000,
      "backgroundColor": "#1A56DB"
    }
  }
}
EOF
      
      - name: Initialize and sync
        run: |
          npx cap init com.kaogong.daily "考公晨读" --web-dir=. 2>/dev/null || npx cap init com.kaogong.daily "考公晨读"
          npx cap add android 2>/dev/null || true
          npx cap sync android
      
      - name: Accept licenses and build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaogong-daily-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
